<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Reproductor</title>
  
  <!-- Vinculación del Manifiesto PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121212">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .player-card {
      background: #181818;
      padding: 24px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      width: 100%;
      max-width: 340px;
    }
    .cover-art {
      width: 100%;
      aspect-ratio: 1/1;
      border-radius: 12px;
      object-fit: cover;
      margin-bottom: 20px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
    }
    .track-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-artist {
      font-size: 0.95rem;
      color: #b3b3b3;
      margin-bottom: 20px;
    }
    audio {
      width: 100%;
      outline: none;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div class="player-card">
    <img id="portada" class="cover-art" src="https://picsum.photos/512/512" alt="Portada">
    
    <div class="track-title" id="titulo">Episodio / Canción de Prueba</div>
    <div class="track-artist" id="artista">Nombre del Artista</div>

    <!-- Audio de prueba funcional -->
    <audio id="miAudio" controls preload="metadata">
      <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
      Tu navegador no soporta el elemento de audio.
    </audio>
  </div>

  <script>
    // 1. Registrar Service Worker para PWA / Notificaciones
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => console.log('SW error:', err));
      });
    }

    const audio = document.getElementById('miAudio');

    // Datos de la canción / podcast
    const trackInfo = {
      title: 'Episodio de Prueba',
      artist: 'Mi Podcast / Artista',
      album: 'Álbum Demo',
      artworkUrl: 'https://picsum.photos/512/512'
    };

    // 2. Configurar la Media Session API (Notificación nativa estilo Spotify)
    function actualizarMediaSession() {
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: trackInfo.title,
          artist: trackInfo.artist,
          album: trackInfo.album,
          artwork: [
            { src: trackInfo.artworkUrl, sizes: '96x96', type: 'image/jpeg' },
            { src: trackInfo.artworkUrl, sizes: '128x128', type: 'image/jpeg' },
            { src: trackInfo.artworkUrl, sizes: '192x192', type: 'image/jpeg' },
            { src: trackInfo.artworkUrl, sizes: '512x512', type: 'image/jpeg' }
          ]
        });

        // Controles desde la pantalla de bloqueo y barra de notificaciones
        navigator.mediaSession.setActionHandler('play', () => audio.play());
        navigator.mediaSession.setActionHandler('pause', () => audio.pause());

        navigator.mediaSession.setActionHandler('seekbackward', () => {
          audio.currentTime = Math.max(audio.currentTime - 10, 0);
        });
        
        navigator.mediaSession.setActionHandler('seekforward', () => {
          audio.currentTime = Math.min(audio.currentTime + 10, audio.duration || 0);
        });

        try {
          navigator.mediaSession.setActionHandler('previoustrack', () => {
            audio.currentTime = 0; // Ejemplo: Reiniciar canción
          });
          navigator.mediaSession.setActionHandler('nexttrack', () => {
            audio.currentTime = 0;
          });
        } catch (e) {}
      }
    }

    // Actualizar posición de la barra en la notificación
    function actualizarEstadoPosicion() {
      if ('mediaSession' in navigator && 'setPositionState' in navigator.mediaSession) {
        if (!isNaN(audio.duration) && audio.duration > 0) {
          navigator.mediaSession.setPositionState({
            duration: audio.duration,
            playbackRate: audio.playbackRate,
            position: audio.currentTime
          });
        }
      }
    }

    // Eventos del reproductor
    audio.addEventListener('play', () => {
      if ('mediaSession' in navigator) {
        navigator.mediaSession.playbackState = 'playing';
      }
      actualizarMediaSession();
      actualizarEstadoPosicion();
    });

    audio.addEventListener('pause', () => {
      if ('mediaSession' in navigator) {
        navigator.mediaSession.playbackState = 'paused';
      }
    });

    audio.addEventListener('timeupdate', actualizarEstadoPosicion);
  </script>
</body>
</html>
